<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matrix Digital Rain</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050806;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <script src="../../shaders/registry.js"></script>
  <script src="../../bridge.js"></script>
  <script>
    (() => {
      "use strict";
      const canvas = document.getElementById("matrix");
      const ctx = canvas.getContext("2d");

      const CHARSETS = {
        katakana: "アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&*+-=<>",
        binary: "01",
        hex: "0123456789ABCDEF"
      };

      const config = {
        speed: 1.0,
        color: "#00ff66",
        density: 0.85,
        charset: "katakana",
        paused: false,
        systemPaused: false
      };

      let width = window.innerWidth;
      let height = window.innerHeight;
      const fontSize = 16;
      let columns = 0;
      let drops = [];
      let speeds = [];
      let activeCols = [];
      const ripples = [];
      let mouse = { x: -1000, y: -1000, activeUntil: 0 };

      function hexToRgb(hex) {
        const clean = String(hex).replace("#", "").trim();
        const num = parseInt(clean.length === 3 ? clean.split("").map(c => c + c).join("") : clean, 16) || 0x00ff66;
        return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
      }

      function initColumns() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        columns = Math.ceil(width / fontSize);
        drops = new Array(columns);
        speeds = new Array(columns);
        activeCols = new Array(columns);

        for (let i = 0; i < columns; i++) {
          drops[i] = Math.random() * -50;
          speeds[i] = 0.6 + Math.random() * 0.8;
          activeCols[i] = Math.random() <= config.density;
        }
        ctx.fillStyle = "#050806";
        ctx.fillRect(0, 0, width, height);
      }

      function updateDensity() {
        for (let i = 0; i < columns; i++) {
          activeCols[i] = ((i * 2654435761) % 1000) / 1000 <= config.density;
        }
      }

      window.addEventListener("resize", initColumns);
      initColumns();

      // Mouse interaction
      window.addEventListener("pointermove", (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.activeUntil = performance.now() + 800;
      });

      window.addEventListener("pointerdown", (e) => {
        ripples.push({
          x: e.clientX,
          y: e.clientY,
          radius: 5,
          maxRadius: e.button === 2 ? 280 : 180,
          strength: e.button === 2 ? -1 : 1,
          alpha: 1.0
        });
      });

      window.addEventListener("contextmenu", (e) => e.preventDefault());

      // Bridge integration
      function applySettings(cfg) {
        if (!cfg) return;
        if (cfg.speed !== undefined) config.speed = parseFloat(cfg.speed) || 1.0;
        if (cfg.color !== undefined) config.color = cfg.color;
        if (cfg.density !== undefined) {
          config.density = parseFloat(cfg.density);
          updateDensity();
        }
        if (cfg.charset && CHARSETS[cfg.charset]) {
          config.charset = cfg.charset;
        }
        if (cfg.paused !== undefined) config.paused = !!cfg.paused;
        if (cfg.__systemPaused !== undefined) config.systemPaused = !!cfg.__systemPaused;
      }

      if (window.AsciiDesk) {
        window.AsciiDesk.onConfig(applySettings);
      }
      window.addEventListener("message", (e) => {
        if (e.data && e.data.type === "ASCII_DESK_CONFIG") {
          applySettings(e.data.values);
        } else if (e.data && e.data.type === "ASCII_DESK_PAUSE") {
          config.systemPaused = !!e.data.paused;
        }
      });

      let lastTime = performance.now();
      function render(now) {
        requestAnimationFrame(render);
        if (config.paused || config.systemPaused) {
          lastTime = now;
          return;
        }

        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        ctx.fillStyle = "rgba(5, 8, 6, 0.12)";
        ctx.fillRect(0, 0, width, height);

        const [r, g, b] = hexToRgb(config.color);
        const chars = CHARSETS[config.charset] || CHARSETS.katakana;
        ctx.font = `600 ${fontSize}px Consolas, "Geist Mono", monospace`;

        for (let i = 0; i < columns; i++) {
          if (!activeCols[i]) continue;

          const x = i * fontSize;
          const y = drops[i] * fontSize;

          let boost = 1.0;
          if (now < mouse.activeUntil) {
            const dist = Math.hypot(x - mouse.x, y - mouse.y);
            if (dist < 110) {
              boost = 2.4;
            }
          }

          for (const rip of ripples) {
            const dist = Math.hypot(x - rip.x, y - rip.y);
            if (Math.abs(dist - rip.radius) < 28) {
              boost = rip.strength > 0 ? 3.2 : 0.2;
            }
          }

          const char = chars[Math.floor(Math.random() * chars.length)];

          // Bright leading head
          ctx.fillStyle = `rgb(${Math.min(255, r + 150)}, ${Math.min(255, g + 150)}, ${Math.min(255, b + 150)})`;
          ctx.fillText(char, x, y);

          // Main trail character slightly above
          ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
          const prevChar = chars[Math.floor(Math.random() * chars.length)];
          ctx.fillText(prevChar, x, y - fontSize);

          drops[i] += speeds[i] * config.speed * boost * (dt * 32);

          if (y > height && Math.random() > 0.975) {
            drops[i] = Math.random() * -10;
          }
        }

        // Draw interactive shockwaves on click
        for (let i = ripples.length - 1; i >= 0; i--) {
          const rip = ripples[i];
          rip.radius += dt * 320 * (0.6 + config.speed * 0.4);
          rip.alpha = Math.max(0, 1 - rip.radius / rip.maxRadius);
          ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${rip.alpha * 0.45})`;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(rip.x, rip.y, rip.radius, 0, Math.PI * 2);
          ctx.stroke();
          if (rip.radius >= rip.maxRadius) {
            ripples.splice(i, 1);
          }
        }
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
